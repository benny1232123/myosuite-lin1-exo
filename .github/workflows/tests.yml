name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  exo:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: device, drive, contract, reset and geometry tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest myosuite/tests/test_lin1_exo.py `
                 myosuite/tests/test_lin1_exo_drive.py `
                 myosuite/tests/test_obs_contract.py `
                 myosuite/tests/test_reset_reproducibility.py `
                 myosuite/tests/test_runtime_geometry_consistency.py -q
